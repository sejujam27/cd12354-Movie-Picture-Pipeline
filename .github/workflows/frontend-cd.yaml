name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 972647051317.dkr.ecr.us-east-1.amazonaws.com/frontend
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Get backend API URL
        run: |
          for i in {1..30}; do
            BACKEND_HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$BACKEND_HOST" ]; then
              echo "BACKEND_URL=http://${BACKEND_HOST}" >> "$GITHUB_ENV"
              break
            fi
            echo "Waiting for backend LoadBalancer..."
            sleep 10
          done

          if [ -z "$BACKEND_HOST" ]; then
            echo "Backend LoadBalancer hostname was not available."
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${BACKEND_URL}" \
            --tag "${ECR_REPOSITORY}:${GITHUB_SHA}" \
            starter/frontend

      - name: Push Docker image
        run: docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Prepare Kubernetes manifests
        run: |
          mkdir -p /tmp/frontend-k8s
          cp starter/frontend/k8s/kustomization.yaml /tmp/frontend-k8s/
          cp starter/frontend/k8s/deployment.yaml /tmp/frontend-k8s/
          cp starter/frontend/k8s/service.yaml /tmp/frontend-k8s/
          sed -i "s#image: frontend#image: ${ECR_REPOSITORY}:${GITHUB_SHA}#" /tmp/frontend-k8s/deployment.yaml

      - name: Deploy with Kustomize
        run: kubectl kustomize /tmp/frontend-k8s | kubectl apply -f -

      - name: Verify deployment
        run: kubectl rollout status deployment/frontend --timeout=180s
